<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Contador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .widget-card {
      width: 220px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .widget-title {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .widget-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }
    .widget-count {
      font-size: 26px;
      font-weight: 800;
      font-family: monospace;
    }
    .flags-container {
      display: flex;
      gap: 5px;
      margin-top: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="widget-card" id="card">
    <div class="widget-title" id="w-title">VISITAS GENERALES</div>
    <img src="assets/globo.gif" alt="Icono" class="widget-img" id="w-img">
    <div class="widget-count" id="w-count">000102</div>
    <div class="flags-container" id="w-flags" style="display: none;">
      <span>🇦🇷 12</span> <span>🇧🇷 5</span> <span>🇪🇸 3</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    // Captura de parámetros recibidos
    const id = params.get('id') || 'demo';
    const titulo = params.get('titulo') || 'VISITAS GENERALES';
    const img = params.get('img') || 'assets/globo.gif';
    const bg = params.get('bg') || '#0f172a';
    const text = params.get('text') || '#ffffff';
    const banderas = params.get('banderas') || 'SI';

    // Aplicar personalización
    const card = document.getElementById('card');
    card.style.backgroundColor = bg;
    card.style.color = text;
    
    document.getElementById('w-title').innerText = titulo;
    document.getElementById('w-title').style.color = text;
    document.getElementById('w-img').src = img;
    document.getElementById('w-flags').style.display = (banderas === 'SI') ? 'flex' : 'none';

    // Manejo de visitas
    let visits = localStorage.getItem('count_' + id) || 102;
    document.getElementById('w-count').innerText = String(visits).padStart(6, '0');
  </script>
</body>
</html>
