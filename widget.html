<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget Contador de Visitas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
    }
    .widget-card {
      background: #0f172a;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      width: 240px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .globe-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 6px auto;
      display: block;
    }
    .title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    /* Lista de Países y Ciudades */
    .countries-section {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      max-height: 130px;
      overflow-y: auto;
      text-align: left;
    }
    .country-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .country-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flag-icon {
      width: 16px;
      height: 12px;
      border-radius: 2px;
      object-fit: cover;
    }
    .toggle-city-btn {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 10px;
      cursor: pointer;
      padding: 0 4px;
    }
    .cities-list {
      display: none;
      padding-left: 22px;
      font-size: 10px;
      opacity: 0.75;
      margin-bottom: 6px;
    }
    /* Métricas Temporales */
    .grid-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .stat-box {
      background: rgba(255,255,255,0.06);
      padding: 5px 4px;
      border-radius: 6px;
    }
    .stat-label {
      font-size: 8px;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .stat-value {
      font-size: 13px;
      font-weight: bold;
      font-family: monospace;
      margin-top: 1px;
    }
    .stat-box.total {
      grid-column: span 2;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .stat-box.total .stat-value {
      font-size: 16px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="widget-card" id="card">
    <img id="img-globo" src="./assets/globo.gif" class="globe-img" alt="Elemento Visual">
    <div class="title" id="txt-titulo">Cargando...</div>
    
    <!-- Contenedor Geográfico -->
    <div class="countries-section" id="countries-list">
      <div style="font-size: 10px; text-align: center; opacity: 0.6;">Cargando ubicaciones...</div>
    </div>

    <!-- Bloque de Métricas Generales -->
    <div class="grid-stats">
      <div class="stat-box">
        <div class="stat-label">Hoy</div>
        <div class="stat-value" id="val-hoy">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Semana</div>
        <div class="stat-value" id="val-semana">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Mes</div>
        <div class="stat-value" id="val-mes">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Estado</div>
        <div class="stat-value" style="color:#4ade80;">Online</div>
      </div>
      <div class="stat-box total">
        <div class="stat-label">Total Visitas</div>
        <div class="stat-value" id="val-total">-</div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('id') || 'demo';

    // Usamos la API relativa de Vercel directamente
    const endpoint = `/api/contador?action=registrar&id=${clientId}&_=${Date.now()}`;

    fetch(endpoint)
      .then(res => res.json())
      .then(data => {
        document.getElementById('val-hoy').innerText = data.visitas_hoy;
        document.getElementById('val-semana').innerText = data.visitas_semanal;
        document.getElementById('val-mes').innerText = data.visitas_mes;
        document.getElementById('val-total').innerText = data.vistas_total;
        document.getElementById('txt-titulo').innerText = data.titulo || clientId;

        if (data.elemento_visual) document.getElementById('img-globo').src = data.elemento_visual;

        if (data.personalizado) {
          if (data.personalizado.bg_color) document.getElementById('card').style.backgroundColor = data.personalizado.bg_color;
          if (data.personalizado.text_color) document.getElementById('card').style.color = data.personalizado.text_color;
        }

        const countriesContainer = document.getElementById('countries-list');
        countriesContainer.innerHTML = '';

        if (data.paises && Object.keys(data.paises).length > 0) {
          Object.keys(data.paises).forEach((code, idx) => {
            const item = data.paises[code];
            const flagUrl = code !== 'XX' ? `https://flagcdn.com/w20/${code.toLowerCase()}.png` : '';
            
            const row = document.createElement('div');
            row.className = 'country-row';
            row.innerHTML = `
              <div class="country-info">
                ${flagUrl ? `<img src="${flagUrl}" class="flag-icon" alt="bandera">` : ''}
                <span>${item.nombre}</span>
              </div>
              <div>
                <strong>${item.count}</strong>
                <button class="toggle-city-btn" onclick="toggleCiudades('cities-${idx}')">▼</button>
              </div>
            `;

            const citiesDiv = document.createElement('div');
            citiesDiv.id = `cities-${idx}`;
            citiesDiv.className = 'cities-list';

            Object.keys(item.ciudades).forEach(cityName => {
              const cityRow = document.createElement('div');
              cityRow.innerText = `• ${cityName}: ${item.ciudades[cityName]}`;
              citiesDiv.appendChild(cityRow);
            });

            countriesContainer.appendChild(row);
            countriesContainer.appendChild(citiesDiv);
          });
        } else {
          countriesContainer.innerHTML = '<div style="font-size: 10px; text-align: center; opacity: 0.6;">Sin datos de origen</div>';
        }
      })
      .catch(err => console.error("Error al cargar datos:", err));

    function toggleCiudades(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
  </script>
</body>
</html>
